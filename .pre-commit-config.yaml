# Pre-commit hooks — the fast, auto-fixing subset of the dev gate.
# ty + pytest are deliberately NOT here; they run in CI only so hooks stay fast.
# Install once with: uv run pre-commit install
default_install_hook_types: [pre-commit]

repos:
  # ruff via `uv run` so hooks use the exact version pinned in uv.lock (no mirror drift).
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check --fix
        entry: uv run ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

  - repo: https://github.com/codespell-project/codespell
    rev: v2.3.0
    hooks:
      - id: codespell
        additional_dependencies: [tomli]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-ast
      - id: check-merge-conflict
      - id: check-added-large-files

  # web/'s fast, auto-fixing subset — mirrors the ruff hooks above. typecheck + test
  # stay CI-only, same rationale as ty/pytest.
  - repo: local
    hooks:
      - id: web-eslint
        name: web eslint --fix
        entry: npm --prefix web run lint -- --fix
        language: system
        files: ^web/.*\.(ts|tsx|js|jsx)$
        pass_filenames: false
      - id: web-prettier
        name: web prettier --write
        entry: npm --prefix web run format
        language: system
        files: ^web/.*\.(ts|tsx|js|jsx|css|json|html)$
        pass_filenames: false
