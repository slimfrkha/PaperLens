<title id="agent-turn-title">One agent turn, streamed</title>
<desc id="agent-turn-desc">One chat turn: the ChatAgent loops with the LLM backend, calling search tools and streaming trace events, until the model answers without a tool call; an optional faithfulness check scores the citations before citations and usage stream back.</desc>
