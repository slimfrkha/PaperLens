<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1056 720" width="1056" height="720" role="img" aria-labelledby="compare-title compare-desc">
<title id="compare-title">Compare mode: ask each paper, then synthesize</title>
<desc id="compare-desc">A Compare turn runs one full agent turn per paper and streams each row, then asks the LLM to synthesize one answer reusing the sub-runs' citation markers, optionally checks it for faithfulness, and streams the final answer.</desc>
