<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="breadcrumb-title breadcrumb-desc">
<title id="breadcrumb-title">Breadcrumbs from section numbers</title>
<desc id="breadcrumb-desc">Chunking rebuilds a paper's section tree from heading numbers, so a chunk of section 2.1.1 is embedded with the prefix Paper title > 2 Method > 2.1 Architecture > 2.1.1 Attention.</desc>
