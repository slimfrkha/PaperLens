<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="overview-title overview-desc">
<title id="overview-title">Two flows, one index</title>
<desc id="overview-desc">config.yaml drives an ingestion worker that fills a shared Chroma RAG DB from arXiv, and a ChatAgent that answers by searching it, calling an LLM backend and optional web search, and streaming the answer to the web UI.</desc>
