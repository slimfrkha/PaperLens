<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 600" width="1280" height="600" role="img" aria-labelledby="eval-harness-title eval-harness-desc">
<title id="eval-harness-title">Tune on dev, confirm once on test</title>
<desc id="eval-harness-desc">gen builds a per-paper dev and test split from the ingested pool; run, screen and sweep read only the dev split and report to you; you pick a config, and confirm scores it once on the held-out test split and prints a config.yaml block.</desc>
