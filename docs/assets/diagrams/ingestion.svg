<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="960" height="720" role="img" aria-labelledby="ingestion-title ingestion-desc">
<title id="ingestion-title">Ingestion: extract once, index and tag together</title>
<desc id="ingestion-desc">Ingesting one paper: reuse cached markdown for an already-ingested paper unless re-extracting, otherwise extract arXiv HTML with a Docling PDF fallback; then index and tag concurrently, write the manifest record, and normalize tags once per batch.</desc>
