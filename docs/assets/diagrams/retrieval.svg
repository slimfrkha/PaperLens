<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="960" height="720" role="img" aria-labelledby="retrieval-title retrieval-desc">
<title id="retrieval-title">Retrieval: recall, rerank, cut</title>
<desc id="retrieval-desc">Searcher.search: dense recall plus optional BM25 recall fuse into a candidate pool, which is reranked; a successful rerank with the elbow enabled is cut at the score cliff, otherwise results are truncated to max_k.</desc>
