<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 840" width="960" height="840" role="img" aria-labelledby="auto-mode-title auto-mode-desc">
<title id="auto-mode-title">Auto mode: Ask or Compare?</title>
<desc id="auto-mode-desc">Auto mode sends an Ask turn with fewer than two papers or on any classifier failure; if the tagging-tier classifier says Compare and more than twelve papers are in scope, the user must confirm before a Compare turn is sent.</desc>
