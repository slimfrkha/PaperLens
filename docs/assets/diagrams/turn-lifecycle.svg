<title id="turn-lifecycle-title">One chat turn, start to release</title>
<desc id="turn-lifecycle-desc">A chat turn acquires the per-chat guard or is rejected with 409, streams, persists and releases the guard; Stop persists partial text, a shrunken Compare scope reruns as Ask, and an exception ends in an error event.</desc>
