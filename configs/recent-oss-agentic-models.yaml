# Recent OSS agentic models over a local gpt-oss endpoint.
# All keys and accepted values are documented in configs/examples/reference.yaml.

data_path: data
collection: arxiv_papers

paths:
  rag_db: ${data_path}/${collection}/rag_db
  pdf_dir: ${data_path}/${collection}/papers/pdf
  markdown_dir: ${data_path}/${collection}/papers/text
  chat_history: ${data_path}/${collection}/chat_history
  annotations: ${data_path}/${collection}/annotations
  web_dist: web/dist

embedding:
  model: BAAI/bge-m3
  type: hf
  max_seq_length: 1024
  batch_size: 32
  query_prefix: "query: "
  document_prefix: "document: "

reranker:
  model: BAAI/bge-reranker-v2-m3
  type: hf
  enabled: true

faithfulness:
  type: hf
  enabled: true

llm:
  tagging:
    type: openai
    model: openai/gpt-oss-20b
    api_base: http://127.0.0.1:1234/v1
    api_key_env: LOCAL_LLM_KEY
  chat:
    type: openai
    model: ${llm.tagging.model}
    api_base: ${llm.tagging.api_base}
    api_key_env: ${llm.tagging.api_key_env}

retrieval:
  candidates: 50 # tuned via paperlens-eval confirm; default 20 measurably under-recalls on this pool
  # loose cutoff elbow values
  elbow_mad_multiplier: 7.0
  elbow_prominence: 0.5

sparse:
  type: bm25
  enabled: true

multi_query:
  enabled: true

ingestion:
  auto_start: true

server:
  host: 127.0.0.1
  port: 8000

papers:
  - { name: deepseek-v3, arxiv_id: "2412.19437" }
  - { name: deepseek-v4-preview, arxiv_id: "2606.19348" }
  - { name: glm-4.5, arxiv_id: "2508.06471" }
  - { name: glm-5, arxiv_id: "2602.15763" }
  - { name: kimi-k2, arxiv_id: "2507.20534" }
  - { name: kimi-k2.5, arxiv_id: "2602.02276" }
  - { name: mimo-v2-flash, arxiv_id: "2601.02780" }
  - { name: minimax-m2-series, arxiv_id: "2605.26494" }
  - { name: minimax-m3-msa, arxiv_id: "2606.13392" }
  - { name: nemotron-3-whitepaper, arxiv_id: "2512.20856" }
  - { name: nemotron-3-ultra, arxiv_id: "2606.15007" }
