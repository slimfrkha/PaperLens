# PaperLens configuration reference — every key, its default, and every accepted value.
#
# This file is documentation, not a run config: it lists all options with their defaults
# so you can see what's tunable at a glance. To actually run, copy one of the focused
# templates in this directory (local-gpt-oss / anthropic / gemini / ollama) and edit it,
# or start from here and delete what you don't need.
#
# Every value shown is the built-in default from src/rag/config.py unless noted. All
# relative paths are anchored to this file's directory (the project root). Full prose
# reference: docs/configuration.md.
#
# The `embedding`, `reranker`, and `llm.*` sections are tagged unions: a `type` string
# selects the variant, and only that variant's keys are valid (an unknown key or an
# unknown `type` fails loudly at load — no silent defaulting). Values support OmegaConf
# `${...}` interpolation (e.g. `${server.port}`, `${oc.env:HOME}`), resolved at load
# time; CLI overrides on paperlens-serve/-ingest (e.g. `--server.port=9000`) feed it too.

# --- Data root + collection (the paths below interpolate these) ---
data_path: data                    # base dir for all runtime data (referenced as ${data_path})
collection: arxiv_papers           # Chroma collection name; also namespaces the data paths

# --- Filesystem paths (relative -> anchored to this file's dir; absolute -> used as-is) ---
# ${data_path}/${collection} keeps each collection's data isolated; edit freely.
paths:
  rag_db: ${data_path}/${collection}/rag_db             # Chroma persistent dir + papers.json manifest
  pdf_dir: ${data_path}/${collection}/papers/pdf        # downloaded PDFs (<paper_id>.pdf)
  markdown_dir: ${data_path}/${collection}/papers/text  # Docling-extracted markdown (<paper_id>.md)
  chat_history: ${data_path}/${collection}/chat_history # per-session chat JSON files
  web_dist: web/dist                                     # built frontend SPA served by the backend

# --- Embedder: turns chunks (and queries) into vectors ---
# `type` selects the variant; keys below are per-type (common: model, batch_size):
#   hf      model, batch_size, max_seq_length            (local; default)
#   openai  model, batch_size, api_base, api_key_env     (any OpenAI-compatible endpoint)
#   gemini  model, batch_size, api_key_env               (GEMINI_API_KEY)
#   ollama  model, batch_size, api_base                  (native /api/embed)
embedding:
  type: hf                # hf | openai | gemini | ollama
  model: BAAI/bge-m3      # HF model id (or the API model name for api types)
  batch_size: 32          # embedding batch size
  max_seq_length: 1024    # hf only; token cap guarding the MPS 2**32 tensor limit on Apple Silicon

# --- Reranker: second retrieval stage, scores recalled chunks ---
#   hf    model, enabled   (local cross-encoder)
#   llm   enabled          (reuses the chat LLM — no extra model/deps)
reranker:
  type: hf                # hf | llm
  model: BAAI/bge-reranker-v2-m3  # cross-encoder model id (hf type only)
  enabled: true           # turn the whole rerank stage on/off

# --- LLMs: two specs (tagging + chat), each a tagged union on `type` ---
#   tagging -> labels papers at ingestion (cheap + fast is fine)
#   chat    -> powers the agentic-RAG loop; MUST support tool/function calling
# `type` selects the provider variant; keys are per-type:
#   common (all)                model, api_key_env, max_tokens (2048), temperature (0.0)
#   anthropic | gemini          (no api_base; api_key_env defaults ANTHROPIC_/GEMINI_API_KEY)
#   openai | vllm | sglang      + api_base  (OpenAI wire format; local servers ignore the key)
llm:
  tagging:
    type: anthropic
    model: claude-haiku-4-5-20251001
    api_key_env: ANTHROPIC_API_KEY
    max_tokens: 2048
    temperature: 0.0
  chat:
    type: anthropic
    model: claude-opus-4-8
    api_key_env: ANTHROPIC_API_KEY
    max_tokens: 2048
    temperature: 0.0

# --- Ingestion worker ---
ingestion:
  auto_start: true        # start the background ingestion worker when the app launches
  concurrency: 1          # papers ingested in parallel

# --- HTTP server ---
server:
  host: 127.0.0.1
  port: 8000

# --- The paper list. Anything already in the DB is skipped. ---
#   name      human name AND the paper_id (filename stem, manifest key, search filter)
#   arxiv_id  arXiv id used to download the PDF (quote it)
papers: []
  # - { name: deepseek-v3, arxiv_id: "2412.19437" }
