# PaperLens configuration reference — every key, its default, and every accepted value.
#
# This file is documentation, not a run config: it lists all options with their defaults
# so you can see what's tunable at a glance. To actually run, copy one of the focused
# templates in this directory (local-gpt-oss / anthropic / gemini / ollama) and edit it,
# or start from here and delete what you don't need.
#
# Every value shown is the built-in default from src/rag/config.py unless noted. The one
# exception is `paths` (below): the values shown are the recommended collection-namespaced
# layout, NOT the dataclass defaults — those are flat (e.g. `data/rag_db`). All relative
# paths are anchored to this file's directory (the project root). Full prose reference:
# docs/configuration.md.
#
# The `embedding`, `reranker`, and `llm.*` sections are tagged unions: a `type` string
# selects the variant, and only that variant's keys are valid (an unknown key or an
# unknown `type` fails loudly at load — no silent defaulting). Values support OmegaConf
# `${...}` interpolation (e.g. `${server.port}`, `${oc.env:HOME}`), resolved at load
# time; CLI overrides on paperlens-serve/-ingest (e.g. `--server.port=9000`) feed it too.

# --- Data root + collection (the paths below interpolate these) ---
data_path: data # base dir for all runtime data (referenced as ${data_path})
collection: arxiv_papers # Chroma collection name; also namespaces the data paths

# --- Filesystem paths (relative -> anchored to this file's dir; absolute -> used as-is) ---
# Setting the ${data_path}/${collection} prefix below is what keeps each collection's data
# isolated — it is NOT automatic. Omit a path and you get the flat dataclass default for it
# (e.g. `data/rag_db`, un-namespaced), not a derived one. Edit freely.
paths:
  rag_db: ${data_path}/${collection}/rag_db # Chroma persistent dir + papers.json manifest
  pdf_dir: ${data_path}/${collection}/papers/pdf # downloaded PDFs (<paper_id>.pdf)
  markdown_dir: ${data_path}/${collection}/papers/text # Docling-extracted markdown (<paper_id>.md)
  chat_history: ${data_path}/${collection}/chat_history # per-session chat JSON files
  annotations: ${data_path}/${collection}/annotations # per-paper annotation JSON files
  web_dist: web/dist # built frontend SPA served by the backend

# --- Embedder: turns chunks (and queries) into vectors ---
# `type` selects the variant; keys below are per-type (common: model, batch_size):
#   hf      model, batch_size, max_seq_length            (local; default)
#   openai  model, batch_size, api_base, api_key_env     (any OpenAI-compatible endpoint)
#   gemini  model, batch_size, api_key_env               (GEMINI_API_KEY)
#   ollama  model, batch_size, api_base                  (native /api/embed)
embedding:
  type: hf # hf | openai | gemini | ollama
  model: BAAI/bge-m3 # HF model id (or the API model name for api types)
  batch_size: 32 # embedding batch size
  max_seq_length: 1024 # hf only; token cap guarding the MPS 2**32 tensor limit on Apple Silicon
  query_prefix: "" # hf only; prepended to queries before embedding, e.g. "query: " (e5)
  document_prefix: "" # hf only; prepended to chunks before embedding; changing requires re-ingest

# --- Reranker: second retrieval stage, scores recalled chunks ---
#   hf    model, enabled, max_length   (local cross-encoder)
#   llm   enabled, max_chars           (reuses the chat LLM — no extra model/deps)
reranker:
  type: hf # hf | llm
  model: BAAI/bge-reranker-v2-m3 # cross-encoder model id (hf type only)
  enabled: true # turn the whole rerank stage on/off
  max_length: 512 # hf only; cross-encoder input token cap — raise if chunking.max_tokens grows
  # max_chars: 600        # llm only (not valid on type: hf); per-passage excerpt sent to the judge LLM

# --- Sparse: opt-in hybrid dense+BM25 retrieval, fused via RRF before reranking ---
# Unproven until screened: `enabled: false` by default — measure it first with
# `paperlens-eval screen --tier retrieval --hybrid` (docs/harness.md), then flip it on.
sparse:
  type: bm25 # bm25 only, today
  enabled: false # opt-in — unlike reranker.enabled, this needs a harness screen first
  rrf_k: 60 # reciprocal-rank-fusion constant; shared across sparse variants
  fetch_multiplier: 3 # each system over-fetches fetch_multiplier * candidates before fusing
  k1: 1.5 # bm25 only; term-frequency saturation constant (rank_bm25 default)
  b: 0.75 # bm25 only; length-normalization constant (rank_bm25 default)

# --- Faithfulness: opt-in post-generation check over [rN]-cited sentences ---
# Passive labeling only — attaches a verdict to each checked citation, never changes the
# answer. `enabled: false` by default, like sparse.enabled. See docs/architecture.md for why
# this is a consistency-scoring cross-encoder rather than a generic NLI model.
faithfulness:
  type: hf # hf only, today
  enabled: false # opt-in — post-generation check is unproven/uncalibrated per-pool
  model: vectara/hallucination_evaluation_model # local consistency-scoring cross-encoder
  revision: hhem-1.0-open # pinned: the default revision needs trust_remote_code (won't load here)
  max_length: 512 # cross-encoder input token cap (scoring is sentence-vs-sentence)
  contradiction_max: 0.05 # score <= this -> "contradiction"
  entailment_min: 0.3 # score >= this -> "entailment"; between -> "neutral"

# --- LLMs: two specs (tagging + chat), each a tagged union on `type` ---
#   tagging -> labels papers at ingestion (cheap + fast is fine)
#   chat    -> powers the agentic-RAG loop; MUST support tool/function calling
# `type` selects the provider variant; keys are per-type:
#   common (all)     model, api_key_env, max_tokens (2048), temperature (0.0),
#                     timeout (0.0 -> SDK default), max_retries (-1 -> SDK default)
#   anthropic | gemini          (no api_base; api_key_env defaults ANTHROPIC_/GEMINI_API_KEY)
#   openai | vllm | sglang      + api_base  (OpenAI wire format; local servers ignore the key)
llm:
  tagging:
    type: anthropic
    model: claude-haiku-4-5-20251001
    api_key_env: ANTHROPIC_API_KEY
    max_tokens: 2048
    temperature: 0.0
    timeout: 0.0 # seconds; 0 -> provider SDK default
    max_retries: -1 # -1 -> provider SDK default
  chat:
    type: anthropic
    model: claude-opus-4-8
    api_key_env: ANTHROPIC_API_KEY
    max_tokens: 2048
    temperature: 0.0
    timeout: 0.0 # seconds; 0 -> provider SDK default
    max_retries: -1 # -1 -> provider SDK default

# --- Chunking: corpus-dependent — the defaults are tuned for dense ML papers ---
chunking:
  max_tokens: 512 # target max tokens per chunk
  overlap_tokens: 64 # overlap between sub-chunks of a large section
  min_tokens: 24 # sections shorter than this are dropped (titles, stray captions)
  noise_ratio: 0.4 # fraction of numeric/punctuation tokens that flags caption noise
  extra_skip_titles: [] # extra case-insensitive regexes for section titles to always drop
    # - "author contributions"

# --- Extraction: PDF -> markdown via Docling ---
extraction:
  ocr_enabled: false # turn on for scanned/no-text-layer PDFs (slower, extra model download)

# --- Retrieval: the agentic search loop (the model can request a different top_k) ---
retrieval:
  k: 5 # passages returned per search_papers call; must be <= candidates
  candidates:
    20 # dense-recall pool size handed to the reranker (floor; a larger
    # top_k scales the pool to 4x it, so the reranker can still discard)
  max_rounds: 8 # ReAct search/answer cycles before the agent must answer

# --- Tagging: how generate_tags shapes its LLM prompt (the model itself is llm.tagging) ---
tagger:
  max_tags: 12
  min_tags: 5
  max_excerpt_chars: 6000 # how much of the paper (title/abstract/headings) to tag from

# --- Multi query retrieval ---
# Opt-in in code (`enabled: false` by default) —
# extra LLM call + n_paraphrases extra retrievals per search_papers call
# measure your own pool with `paperlens-eval screen --tier retrieval --multi-query` (docs/harness.md)
# before trusting this blindly, same as sparse/faithfulness ask you to for their own opt-ins.
multi_query:
  enabled: true # recommended default, not measured for your specific pool — see comment above
  n_paraphrases: 3
  fetch_multiplier: 3

# --- Ingestion worker ---
ingestion:
  auto_start: true # start the background ingestion worker when the app launches

# --- HTTP server ---
server:
  host: 127.0.0.1
  port: 8000

# --- The paper list. Anything already in the DB is skipped. ---
#   name      human name AND the paper_id (filename stem, manifest key, search filter)
#   arxiv_id  arXiv id used to download the PDF (quote it)
papers: []
  # - { name: deepseek-v3, arxiv_id: "2412.19437" }
