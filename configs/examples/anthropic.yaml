# Cloud LLMs via Anthropic (Claude), local HF embedder + reranker.
# Needs: ANTHROPIC_API_KEY in .env (`uv sync` includes the provider dependencies)

data_path: data
collection: arxiv_papers

paths:
  rag_db: ${data_path}/${collection}/rag_db
  pdf_dir: ${data_path}/${collection}/papers/pdf
  markdown_dir: ${data_path}/${collection}/papers/text
  chat_history: ${data_path}/${collection}/chat_history
  annotations: ${data_path}/${collection}/annotations
  web_dist: web/dist

embedding:
  model: BAAI/bge-m3
  type: hf
  max_seq_length: 1024
  batch_size: 32

reranker:
  model: BAAI/bge-reranker-v2-m3
  type: hf
  enabled: true

llm:
  tagging:
    type: anthropic
    model: claude-haiku-4-5-20251001   # cheap + fast for tagging
    api_key_env: ANTHROPIC_API_KEY
  chat:
    type: anthropic
    model: claude-opus-4-8
    api_key_env: ${llm.tagging.api_key_env}

ingestion:
  auto_start: true

server:
  host: 127.0.0.1
  port: 8000

papers:
  - { name: deepseek-v3, arxiv_id: "2412.19437" }
  - { name: kimi-k2,     arxiv_id: "2507.20534" }
