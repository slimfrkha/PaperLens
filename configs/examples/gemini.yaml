# Google Gemini for both embeddings and the LLMs.
# Needs:  uv sync --extra gemini   and   GEMINI_API_KEY in .env

data_path: data
collection: arxiv_papers

paths:
  rag_db: ${data_path}/${collection}/rag_db
  pdf_dir: ${data_path}/${collection}/papers/pdf
  markdown_dir: ${data_path}/${collection}/papers/text
  chat_history: ${data_path}/${collection}/chat_history
  annotations: ${data_path}/${collection}/annotations
  web_dist: web/dist

embedding:
  model: gemini-embedding-001
  type: gemini
  batch_size: 32
  api_key_env: GEMINI_API_KEY

reranker:
  type: llm            # reuse the chat LLM to score relevance (no extra model/deps)
  enabled: true

llm:
  tagging:
    type: gemini
    model: gemini-2.5-flash
    api_key_env: GEMINI_API_KEY
  chat:
    type: gemini
    model: gemini-2.5-pro
    api_key_env: ${llm.tagging.api_key_env}

ingestion:
  auto_start: true

server:
  host: 127.0.0.1
  port: 8000

papers:
  - { name: deepseek-v3, arxiv_id: "2412.19437" }
  - { name: kimi-k2,     arxiv_id: "2507.20534" }
