# Fully local via Ollama: native /api/embed for embeddings, /v1 (OpenAI-compatible)
# for the LLMs. Needs `ollama serve` running with the models pulled.
# The chat model must support tool/function calling.

data_path: data
collection: arxiv_papers

paths:
  rag_db: ${data_path}/${collection}/rag_db
  pdf_dir: ${data_path}/${collection}/papers/pdf
  markdown_dir: ${data_path}/${collection}/papers/text
  chat_history: ${data_path}/${collection}/chat_history
  web_dist: web/dist

embedding:
  model: bge-m3
  type: ollama
  batch_size: 32
  api_base: http://localhost:11434

reranker:
  type: llm            # cross-encoder reranking isn't served by Ollama; reuse the chat LLM
  enabled: true

llm:
  tagging:
    type: openai   # Ollama's OpenAI-compatible endpoint
    model: llama3.1:8b
    api_base: http://localhost:11434/v1
    api_key_env: LOCAL_LLM_KEY
  chat:
    type: openai
    model: ${llm.tagging.model}
    api_base: ${llm.tagging.api_base}
    api_key_env: ${llm.tagging.api_key_env}

ingestion:
  auto_start: true

server:
  host: 127.0.0.1
  port: 8000

papers:
  - { name: deepseek-v3, arxiv_id: "2412.19437" }
  - { name: kimi-k2,     arxiv_id: "2507.20534" }
