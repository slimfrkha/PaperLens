name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Python gate — the same 4 commands run locally and in pre-commit's fast subset:
  #   ruff format --check · ruff check · ty check · pytest --cov
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv (with cache)
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync

      - name: ruff format --check
        run: uv run ruff format --check

      - name: ruff check
        run: uv run ruff check

      - name: ty check
        run: uv run ty check src

      - name: pytest --cov
        run: uv run pytest --cov=rag --cov=server --cov=eval --cov-branch --cov-report=term-missing

  # Frontend gate — the same 4 commands run locally and in the web pre-commit hooks:
  #   format:check · lint · typecheck · test
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: format:check
        run: npm run format:check

      - name: lint
        run: npm run lint

      - name: typecheck
        run: npm run typecheck

      - name: test
        run: npm run test:cov

      - name: build
        run: npm run build
