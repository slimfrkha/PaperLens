# PaperLens — single source of truth for the whole app.
# Edit this file to change paths, models, or the paper list, then (re)launch
# `python -m server` or run `python -m rag.ingest`.

# All paths are relative to this config file's directory (the project root),
# so the app runs correctly from any working directory. Absolute paths are used
# as-is.
paths:
  rag_db: data/rag_db          # Chroma persistent dir + papers.json manifest
  pdf_dir: data/papers/pdf     # downloaded PDFs
  markdown_dir: data/papers/text  # Docling-extracted markdown
  chat_history: data/chat_history # per-session ChatML JSON files
  web_dist: web/dist           # built frontend SPA served by the backend

collection: arxiv_papers  # Chroma collection name

embedding:
  model: BAAI/bge-m3      # HF model id, or API model name when type=openai
  type: hf                # hf | openai
  max_seq_length: 1024    # cap guards MPS 2**32 tensor limit on Apple Silicon
  batch_size: 32
  api_base: null          # OpenAI-compatible base URL (type=openai only)
  api_key_env: OPENAI_API_KEY

reranker:
  model: BAAI/bge-reranker-v2-m3
  enabled: true

llm:
  # provider: anthropic | openai | vllm | sglang | gemini
  #   (vllm/sglang/openai all speak the OpenAI wire format — just set api_base;
  #    this also covers LM Studio, Ollama /v1, llama.cpp, Azure, etc.
  #    gemini uses Google's API — set api_key_env: GEMINI_API_KEY)
  # Model that generates paper tags during ingestion (cheap + fast is fine).
  tagging:
    provider: openai
    model: openai/gpt-oss-20b  # whatever the endpoint serves
    api_base: http://127.0.0.1:1234/v1
    api_key_env: LOCAL_LLM_KEY   # local servers ignore this; no key needed
  # Model that powers the chat / agentic-RAG loop.
  # NOTE: the chat agent calls a `search_papers` tool, so the served model must
  # support OpenAI function/tool calling.
  chat:
    provider: openai
    model: openai/gpt-oss-20b  # whatever the endpoint serves
    api_base: http://127.0.0.1:1234/v1
    api_key_env: LOCAL_LLM_KEY

ingestion:
  auto_start: true        # start the ingestion worker when the app launches
  concurrency: 1          # papers ingested in parallel

server:
  host: 127.0.0.1
  port: 8000

# The papers to ingest. Anything already in the DB is skipped.
papers:
  - { name: deepseek-v3,           arxiv_id: "2412.19437" }
  - { name: deepseek-v4-preview,   arxiv_id: "2606.19348" }
  - { name: glm-4.5,               arxiv_id: "2508.06471" }
  - { name: glm-5,                 arxiv_id: "2602.15763" }
  - { name: kimi-k2,               arxiv_id: "2507.20534" }
  - { name: kimi-k2.5,             arxiv_id: "2602.02276" }
  - { name: mimo-v2-flash,         arxiv_id: "2601.02780" }
  - { name: minimax-m2-series,     arxiv_id: "2605.26494" }
  - { name: minimax-m3-msa,        arxiv_id: "2606.13392" }
  - { name: nemotron-3-whitepaper, arxiv_id: "2512.20856" }
  - { name: nemotron-3-ultra,      arxiv_id: "2606.15007" }
