[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paperlens"
version = "0.1.0"
description = "Local, config-driven RAG over arXiv model technical reports."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    # PDF text extraction (Docling pulls in MPS-enabled torch)
    "docling>=2.108",
    # RAG indexing stack
    "chromadb>=1.5",
    "sentence-transformers>=3.0",   # default `hf` embedder + reranker
    "rank-bm25>=0.2",       # sparse (BM25) retrieval for hybrid dense+sparse search
    "litellm>=1.98",        # multi-provider LLM + embedding backend (rag/llm.py, rag/embedders.py); pulls in openai transitively
    "instructor>=1.15",     # validated, retrying structured output on top of litellm (rag/llm.py)
    "pydantic>=2.13",       # response models for instructor; was already transitive, now imported directly
    "tiktoken>=0.7",
    # App backend (FastAPI server + ingestion worker)
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sse-starlette>=2.0",   # SSE streaming for chat
    "httpx>=0.27",          # PDF downloads
    "pyyaml>=6.0",          # config.yaml
    "ruamel.yaml>=0.18",    # comment-preserving config.yaml rewrite (admin add/remove paper)
    "python-dotenv>=1.0",   # load .env (API keys)
    "filelock>=3.16",       # cross-process lock for papers.json writes (rag/manifest.py)
    "draccus>=0.11,<0.12",  # dataclass config + CLI (parse/decode/ChoiceRegistry); pinned: parse_config subclasses ArgumentParser._postprocessing
    "omegaconf>=2.3",       # ${...} interpolation in config.yaml
    "tqdm>=4.68.3",
]

[project.scripts]
paperlens-serve = "server.main:main"
paperlens-ingest = "rag.ingest:main"
paperlens-eval = "eval.cli:main"

[dependency-groups]
dev = ["ruff", "ty", "pytest", "pytest-cov", "pre-commit"]

[tool.hatch.build.targets.wheel]
packages = ["src/rag", "src/server", "src/eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.coverage.run]
branch = true
source = ["rag", "server", "eval"]

[tool.ruff]
src = ["src", "scripts"]
line-length = 100

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pyupgrade, bugbear, simplify
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.codespell]
skip = "*.lock,*package-lock.json,.git,.venv,data,web/node_modules,web/dist,.ruff_cache,.pytest_cache"
# ontext: the `on_text`/`OnText` streaming callback name, not a typo of "context".
# thi: a deliberate `<think>`/`</think>` tag split at a chunk boundary in llm.py's
# streaming think-tag-stripper tests, not a typo of "the"/"this".
ignore-words-list = "ontext,thi"
