[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paperlens"
version = "0.1.0"
description = "Local, config-driven RAG over arXiv model technical reports."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # PDF text extraction (Docling pulls in MPS-enabled torch)
    "docling>=2.108",
    # RAG indexing stack
    "chromadb>=1.5",
    "sentence-transformers>=3.0",
    "openai>=1.0",          # OpenAI-compatible embedding + LLM backend
    "tiktoken>=0.7",
    # App backend (FastAPI server + ingestion worker)
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sse-starlette>=2.0",   # SSE streaming for chat
    "anthropic>=0.40",      # anthropic LLM backend
    "google-genai>=1.0",    # gemini LLM backend
    "httpx>=0.27",          # PDF downloads
    "pyyaml>=6.0",          # config.yaml
    "python-dotenv>=1.0",   # load .env (API keys)
]

[project.scripts]
paperlens-serve = "server.main:main"
paperlens-ingest = "rag.ingest:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
src = ["src"]
line-length = 100
